[package]
name = "sns-dump-init"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = "=1.0.219"
serde_derive = "=1.0.219"
serde_yaml = "0.9"
serde_json = "1"
candid = "0.10"
hex = "0.4"
base64 = "0.13"
clap = { version = "4", features = ["derive"] }

ic-base-types               = { path = "../../ic/rs/types/base_types" }
ic-sns-init                 = { path = "../../ic/rs/sns/init" }
ic-sns-cli                  = { path = "../../ic/rs/sns/cli" }
ic-nns-governance-api       = { path = "../../ic/rs/nns/governance/api" }
ic-nervous-system-proto     = { path = "../../ic/rs/nervous_system/proto" }
ic-nervous-system-humanize  = { path = "../../ic/rs/nervous_system/humanize" }

[workspace]